name: Random Confession Generator

on:
  schedule:
    # Her gün farklı saatlerde çalışır - GitHub Actions her gün bu saatleri otomatik değiştirir
    - cron: '*/73 * * * *'   # Her 73 dakikada bir (günde ~20 kez, farklı saatlerde)
    - cron: '*/97 * * * *'   # Her 97 dakikada bir (günde ~15 kez, farklı saatlerde)
    - cron: '*/127 * * * *'  # Her 127 dakikada bir (günde ~11 kez, farklı saatlerde)
  workflow_dispatch: # Manuel tetikleme için

jobs:
  generate-confession:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Random Confession
        run: |
          curl -X POST "${{ secrets.VERCEL_APP_URL }}/api/auto-confession" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"